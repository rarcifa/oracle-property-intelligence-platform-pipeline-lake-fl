    Unincorporated Lake County plus 14 independent municipalities, each with its own
    building department and permit system

access_states:
  cloudflare_challenged:
    hosts:
      - www.lakecountyfl.gov
      - c.lakecountyfl.gov
      - gis.lakecountyfl.gov
    evidence: HTTP 403 with server cloudflare and cf-mitigated challenge on every path
    consequence: Permit detail pages carrying contractor of record cannot be fetched
  correction_to_prior_findings: >-
    lakecopropappr.com returned HTTP 200 from this egress on 2026-09-09, contradicting an
    earlier record of a blanket 403. The county 403 is a Cloudflare managed challenge
    across the whole lakecountyfl.gov estate rather than datacenter-egress filtering.

