parcel:
  canonical_source: Florida DOR 2026 preliminary NAL
  assessed_parcel_count: 215806
  gis_feature_count: 210935
  count_difference: 4871
  count_difference_pct: 2.2571
  discrepancy_threshold_pct: 2.0
  discrepancy_explanation: >-
    The canonical denominator is the DOR 2026 preliminary NAL (215,806 rows, measured).
    The geometry source is the Florida GIO statewide parcel-centroid 2025 release
    (210,935 Lake rows, measured), which is one roll year older, so parcels first
    assessed for 2026 - new splits, new condo units and new construction - have no
    2025 centroid yet. Geometry is never used as the parcel denominator and never
    seeds a parcel; it only decorates a NAL row that already exists.
  separately_assessed_without_geometry: acknowledged
  identifier_proven: true
  identifier_name: DOR Parcel ID (with Alternate Key as the permit join)
  identifier_format: "NN-NN-NN-NNNN-NNN-NNNNN (23 characters); ALT_KEY is 7 digits"
  join_rule: >-
    PARCEL_ID and ALT_KEY are both unique across all 215,806 NAL rows (measured:
    215,806 distinct of each). ALT_KEY joins the CD Plus permit layer's
    Alternate_Key; the undashed PARCEL_ID matches the layer's Parcel_ID.
  measured_coverage:
    year_built_known: 169007
    physical_zip_known: 212737
    owner_name_known: 215620
    distinct_owner_names: 168315
    out_of_state_owners: 20236
    sale_recorded_in_dor_window: 30977

sales:
  source: Florida DOR SDF 2026 preliminary plus NAL SALE_YR1/SALE_YR2
  record_count: 37020
  parcels_with_a_sale: 30977
  window_first: "2025"
  window_last: "2026"
  ten_year_tenure_provable: false
  ten_year_tenure_evidence: >-
    Only the current roll is published: the NAL folder exposes 2026P alone, and both
    SDF and NAL SALE_YR1 span 2025-2026 only. The DOR Map Data archive publishes Lake
    parcel files back to 2005F, but they carry parcel geometry only - the 2010 Lake
    file was downloaded and its attribute table holds exactly two fields, CO_NO and
    PARCEL_ID, across 178,377 records. Attribute-bearing PAR files begin at 2024F.
    Ownership tenure beyond the 2025-2026 window therefore cannot be proven from any
    published Lake source. The query table exposes no_recorded_sale_in_dor_window as
    an explicit lower bound and never claims a tenure length.

permits:
  expected_jurisdiction_count: 15
  assumes_unified_countywide_history: false
  countywide_layer_record_count: 17915
  countywide_distinct_permit_count: 17671
  countywide_distinct_parcel_count: 12454
  roofing_permit_count: 3312
  open_permit_count: 3753
  open_roofing_permit_count: 247
  roofing_permit_types: [RF, RFC, RFR, ROC, ROR]
  open_permit_statuses: [APPLY, INSPECT, ISSUED, READY, RENEWED]
  coverage_finding: >-
    The county CD Plus layer is NOT a countywide permit archive. Two measured limits.
    First, jurisdiction: a spatial test of every permit parcel against the 14 Census
    city polygons puts 45 of 17,915 features (0.25%) inside any city limit, and those
    are Lake County government facilities that the county permits for itself. The
    layer is unincorporated Lake County only, and no municipality delegates permitting
    to the county. Mailing city is not a jurisdiction signal - 4,688 features carry a
    CLERMONT mailing address while sitting in unincorporated south Lake.
    Second, time: Permit_LastModDate spans 2025-09-09 to 2026-09-08, exactly a 365-day
    rolling window, and only 846 of 17,671 permits (4.8%) were issued before
    2024-09-09. The layer publishes recently-modified permits, not history.
  jurisdictions:
    - jurisdiction: Unincorporated Lake County
      key: unincorporated
      status: supported
      vendor: Perconti CD Plus via Esri MapServer proxy
      portal_kind: read-only-data-service
      portal: https://utility.arcgis.com/usrsvcs/servers/365d9a169bc34110a3db2157c76f6c95/rest/services/Individual/CDPermitParcels/MapServer/0
      historical_records: false
      anonymous_access: true
      adapter: cdplus
      implementation_status: certified
      parcel_search: Query by Alternate_Key or Parcel_ID; OBJECTID range paging at 2,000 rows per page
      enumeration_status: certified-bulk
      throughput: 17,915 features in 6.5 s at concurrency 4; IN lists over ~50 values return HTTP 500
      known_exclusions: >-
        Rolling 365-day Permit_LastModDate window; permits issued and closed before
        2024-09-09 are absent (4.8% of the layer predates that date). Contractor of
        record is not exposed by the layer and its detail pages are Cloudflare-gated.
      records_request:
        recipient_office: Lake County Office of Building Services
        request_portal_url: https://www.lakecountyfl.gov/Public-Records-Request
        request_email: null
        system_scope: >-
          CD Plus permit database, complete history - all permits issued prior to the
          current 12-month Permit_LastModDate window, with ALT_KEY, parcel id, permit
          type, status, applied/issued/CO dates and contractor of record
        route: records-first
    - jurisdiction: Clermont
      key: clermont
      status: supported
      vendor: CentralSquare eTRAKiT 3
      portal_kind: historical-search
      portal: https://etrakit.clermontfl.org/eTRAKiT3/Search/permit.aspx
      historical_records: true
      anonymous_access: true
      adapter: etrakit
      implementation_status: discovered
      parcel_search: SITE_APN search labelled "AK NUMBER", which is the NAL ALT_KEY
      enumeration_status: discovered-open-portal
      probe: >-
        Re-probed 2026-09-09: the permit search page returns HTTP 200, 785,477 bytes in 1.9 s
        with no session, no challenge and no login. The parcel field is labelled "AK NUMBER"
        and posts as SITE_APN, which is the NAL ALT_KEY, so the join needs no translation.
        Search is an ASP.NET postback carrying __VIEWSTATE, so an adapter must round-trip the
        form; permit detail is reachable by a plain GET once a permit number is known.
      known_exclusions: >-
        Detail pages expose contractor names and inspection history, which the county layer
        does not. Not harvested: an eTRAKiT adapter and a throughput measurement are needed
        first, and neither was in scope for this run. This is the single most valuable
        remaining source, because it is the only open route to contractor of record anywhere
        in the county.
