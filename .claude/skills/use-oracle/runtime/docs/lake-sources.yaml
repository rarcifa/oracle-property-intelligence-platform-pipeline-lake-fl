business:
  source: Florida DOR TPP (NAP) 2026 preliminary
  account_count: 33346
  construction_naics_count: 1883
  roofing_naics_238160_count: 44
  note: >-
    Business and contractor records come from the tangible-personal-property roll, which
    carries NAICS codes, owner names and situs addresses. Sunbiz corporate ingest is not
    in this assignment's acceptance criteria and was not run.

