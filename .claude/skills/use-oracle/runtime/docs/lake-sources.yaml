enrichment:
  bbb:
    status: gated
    source_access_status: blocked
    advertised_listing_count: null
    expected_count: null
    listing_page_cap: null
    cap_acknowledged: false
    blocker: >-
      bbb.org answers HTTP 403 to this egress, and the kit requires BBB browser work to
      run on approved AWS-managed remote compute, which this local-only, no-ongoing-cost
      deployment does not have. bbb_rating is published as a real column that stays null,
      with the reason carried in enrichment_status.
  contractor_identity:
    status: gated
    blocker: >-
      Contractor of record lives on the county permit detail pages, which are behind the
      Cloudflare managed challenge on c.lakecountyfl.gov. The Clermont eTRAKiT portal does
      expose contractor names for that municipality and is open to plain HTTP; it is
      catalogued as a discovered, not yet harvested, source.

approved_exceptions:
  - gate: parcel
    reason: >-
      The 2.26% gap between the 2026 assessed roll and the 2025 GIO centroid release is a
      release-year offset, not a missing-parcel defect. The tax roll remains the sole
      parcel denominator, geometry never seeds a parcel, and parcels without a 2025
      centroid publish with null coordinates rather than being dropped.
    approved_by: rarcifa
    approved_at: "2026-09-09T18:00:00Z"

