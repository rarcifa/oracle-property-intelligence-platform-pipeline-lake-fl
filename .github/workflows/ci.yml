# Runs the recipe contract from the kit's `integrate-ci-cd` skill.
#
# That skill's caller workflows delegate to reusable workflows in
# `Spring-Oaks-Capital-LLC/github-workflows`, an organisation this repository
# is not a member of, so those callers would fail on a "workflow not found"
# error rather than run. The recipe names here are identical to the ones the
# skill mandates, so adopting the shared pipeline later replaces this file
# without touching the justfile.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, pr/lake-fl-kit-pipeline]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json already pins
      # `packageManager: pnpm@10.20.0`, and specifying both makes the action
      # fail outright with "Multiple versions of pnpm specified" — which is how
      # this workflow failed the first time it ever ran.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - uses: extractions/setup-just@v2

      - name: Install DuckDB CLI
        run: |
          curl -sSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Install
        run: just setup

      # Fetch the selected submission by the exact served-run receipt and verify every downloaded
      # artifact against its immutable manifest before testing the real tables.
      - name: Fetch the selected submission snapshot
        run: |
          pnpm --filter @oracle-lake/server exec tsx src/data/ci-snapshot.ts /tmp/oracle-selected
          echo "ORACLE_SELECTED_RUN_DIR=/tmp/oracle-selected" >> "$GITHUB_ENV"

      - name: Assert the selected snapshot suite actually ran
        run: |
          ORACLE_SELECTED_RUN_DIR=/tmp/oracle-selected pnpm vitest run packages/server/tests/selected-snapshot.test.ts --reporter=json --outputFile=/tmp/selected-snapshot-tests.json
          jq -e '[.testResults[].assertionResults[] | select(.status != "passed")] | length == 0' /tmp/selected-snapshot-tests.json
          jq -e '[.testResults[].assertionResults[] | select(.status == "passed")] | length >= 5' /tmp/selected-snapshot-tests.json

      # The design lane drives a real Chromium. Without this it fails on a
      # missing browser, which is why `just test` could not honestly run in CI.
      - name: Install Playwright browsers
        run: pnpm --filter @oracle-lake/ui exec playwright install --with-deps chromium

      # Legacy decision regressions use the actual, explicitly unpublished
      # 20260911 local packet. The older public artifact has 62 columns and
      # cannot satisfy this 63-column contract. Never relabel the local bytes
      # with that public CID or substitute current source-only semantics.
      # The current submission's public bytes are tested separately above.
      - name: Materialize the historical local regression fixture
        run: |
          node packages/server/tests/materialize-historical-fixture.ts
          echo "ORACLE_PARQUET_PATH=$GITHUB_WORKSPACE/pipeline/data/artifacts/publish/lake/runs/20260911T131000Z/query-table.parquet" >> "$GITHUB_ENV"
          echo "ORACLE_RUN_DIR=$GITHUB_WORKSPACE/pipeline/data/artifacts/publish/lake/runs/20260911T131000Z" >> "$GITHUB_ENV"
          echo "ORACLE_DATA_RUN_ID=20260911T131000Z" >> "$GITHUB_ENV"
          echo "ORACLE_DATA_ROOT_CID=" >> "$GITHUB_ENV"
          echo "ORACLE_PARQUET_URL=" >> "$GITHUB_ENV"

      - name: Format
        run: just format

      - name: Lint
        run: just lint

      - name: Type check
        run: just type-check

      - name: Type check local publication recovery
        run: pnpm --dir pipeline exec tsc -p tsconfig.publication.json --noEmit

      - name: Test
        run: just test

      # A guard, not a test: if the Parquet source ever stops resolving, the
      # suites above go back to skipping and CI goes back to passing without
      # exercising anything. Fail loudly instead.
      - name: Assert the query-layer suites actually ran
        run: |
          pnpm vitest run packages/server/tests/api.test.ts packages/server/tests/queries.test.ts \
            packages/server/tests/mcp.test.ts --reporter=json --outputFile=/tmp/query-layer.json
          SKIPPED=$(jq '[.testResults[].assertionResults[] | select(.status == "skipped" or .status == "pending")] | length' /tmp/query-layer.json)
          PASSED=$(jq '[.testResults[].assertionResults[] | select(.status == "passed")] | length' /tmp/query-layer.json)
          echo "query-layer tests: passed=$PASSED skipped=$SKIPPED"
          test "$SKIPPED" -eq 0
          test "$PASSED" -ge 50

      - name: Build
        run: just build

      # The county source catalog is fail-closed. A change that breaks the
      # readiness gate must not merge, because every ingestion stage downstream
      # refuses to run against a BLOCKED catalog anyway.
      - name: County readiness gate
        run: just readiness
