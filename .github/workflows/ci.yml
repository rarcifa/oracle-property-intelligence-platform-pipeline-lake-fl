# Runs the recipe contract from the kit's `integrate-ci-cd` skill.
#
# That skill's caller workflows delegate to reusable workflows in
# `Spring-Oaks-Capital-LLC/github-workflows`, an organisation this repository
# is not a member of, so those callers would fail on a "workflow not found"
# error rather than run. The recipe names here are identical to the ones the
# skill mandates, so adopting the shared pipeline later replaces this file
# without touching the justfile.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - uses: extractions/setup-just@v2

      - name: Install
        run: just setup

      - name: Format
        run: just format

      - name: Lint
        run: just lint

      - name: Type check
        run: just type-check

      - name: Test
        run: just test

      - name: Build
        run: just build

      # The county source catalog is fail-closed. A change that breaks the
      # readiness gate must not merge, because every ingestion stage downstream
      # refuses to run against a BLOCKED catalog anyway.
      - name: County readiness gate
        run: just readiness
