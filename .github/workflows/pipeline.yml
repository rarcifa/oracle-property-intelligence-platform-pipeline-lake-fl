# Continuous ingestion.
#
# The assignment requires that ingestion be ongoing rather than a one-shot bulk
# load. This is what makes it recur: a daily incremental refresh windowed on the
# permit layer's own LastModDate, a monthly full rebuild, and manual dispatch.
#
# Scheduled and ordinary manual runs build a frozen local candidate and upload
# it for inspection. Publication is a separate manual dispatch that restores
# those exact bytes and additionally requires a short-lived exact-target
# signature; credentials alone are never authority.
name: Lake County ingestion

on:
  schedule:
    # Daily incremental, 07:20 UTC. Off the hour to avoid the scheduler's peak.
    - cron: "20 7 * * *"
    # Monthly full rebuild, on the 3rd, after the DOR roll settles.
    - cron: "40 6 3 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingestion mode"
        type: choice
        options: [incremental, full]
        default: incremental
      publish:
        description: "Publish to IPFS after building"
        type: boolean
        default: false
      publication_run_id:
        description: "Exact PREPARED_LOCAL run id covered by the signed publication authorization"
        type: string
        required: false
      candidate_workflow_run_id:
        description: "Workflow run id whose lake-run artifact contains the reviewed frozen candidate"
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # One run at a time. Two concurrent publishes would race the single IPNS
  # pointer and the run-history file.
  group: lake-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Install DuckDB
        run: |
          curl -sSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Install runtime
        run: npm ci

      - name: Resolve mode
        id: mode
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 6 3 * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the immutable candidate identity
        id: target
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            RUN_ID="${{ inputs.publication_run_id }}"
            SOURCE_RUN_ID="${{ inputs.candidate_workflow_run_id }}"
            test -n "$RUN_ID" && test -n "$SOURCE_RUN_ID" || {
              echo "::error::publication_run_id and candidate_workflow_run_id are required for publication"
              exit 1
            }
          else
            RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Restore the reviewed frozen candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        uses: actions/download-artifact@v4
        with:
          name: lake-run-${{ steps.target.outputs.run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_workflow_run_id }}

      # The readiness gate runs before any acquisition, exactly as it does
      # locally. A BLOCKED catalog stops the run here.
      - name: County readiness gate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        working-directory: .
        run: |
          python3 pipeline/scripts/validate-county-readiness.py \
            pipeline/docs/lake-sources.yaml

      # A disposable runner has no canonical merge base. Fetching a two-day
      # window against a best-effort cache once published 281 permits as though
      # they were the full 17,671-row layer. Until a content-addressed raw base
      # is supplied by the durable coordinator, clean runners perform a bounded
      # full acquisition. The incremental implementation remains available to
      # that coordinator; this workflow never guesses a base from cache age.
      - name: Acquire sources
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: node scripts/lake/fetch-sources.mjs

      - name: Build seed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: node --max-old-space-size=6144 scripts/lake/build-seed.mjs

      # Clermont is deliberately not live-harvested from a disposable runner.
      # A scheduled build may consume only the last-good immutable 2015-2026
      # baseline certified by the durable local coordinator. Missing, stale,
      # incompatible or corrupt evidence fails before consolidation; it never
      # manufactures an empty CSV or silently drops contractor coverage.
      - name: Require an immutable Clermont baseline location
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        working-directory: .
        env:
          CLERMONT_BASELINE_READ_ROLE_ARN: ${{ vars.CLERMONT_BASELINE_READ_ROLE_ARN }}
          CLERMONT_BASELINE_S3_URI: ${{ vars.CLERMONT_BASELINE_S3_URI }}
        run: |
          test -n "$CLERMONT_BASELINE_READ_ROLE_ARN" || {
            echo "::error::CLERMONT_BASELINE_READ_ROLE_ARN is not configured"
            exit 1
          }
          test -n "$CLERMONT_BASELINE_S3_URI" || {
            echo "::error::CLERMONT_BASELINE_S3_URI is not configured"
            exit 1
          }
          case "$CLERMONT_BASELINE_S3_URI" in s3://*) ;; *)
            echo "::error::CLERMONT_BASELINE_S3_URI must be an s3:// prefix"
            exit 1
          esac

      - name: Assume the read-only baseline role
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CLERMONT_BASELINE_READ_ROLE_ARN }}
          aws-region: ${{ vars.CLERMONT_BASELINE_AWS_REGION || 'us-east-2' }}

      - name: Restore the exact certified Clermont baseline
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        working-directory: .
        env:
          CLERMONT_BASELINE_REQUEST_B64: ${{ secrets.CLERMONT_BASELINE_REQUEST_B64 }}
          CLERMONT_BASELINE_S3_URI: ${{ vars.CLERMONT_BASELINE_S3_URI }}
        run: |
          test -n "$CLERMONT_BASELINE_REQUEST_B64" || {
            echo "::error::no exact certified Clermont baseline request is configured"
            exit 1
          }
          umask 077
          REQUEST="$RUNNER_TEMP/clermont-baseline-request.json"
          STORE="pipeline/data/baselines/lake/clermont"
          printf '%s' "$CLERMONT_BASELINE_REQUEST_B64" | base64 --decode > "$REQUEST"
          DIGEST="$(jq -er '.baseline.requiredSha256 | select(test("^[a-f0-9]{64}$"))' "$REQUEST")"
          mkdir -p "$STORE/baselines/$DIGEST"
          aws s3 cp "$CLERMONT_BASELINE_S3_URI/last-good.json" "$STORE/last-good.json" --no-progress
          POINTER_DIGEST="$(jq -er '.baselineSha256' "$STORE/last-good.json")"
          test "$POINTER_DIGEST" = "$DIGEST" || {
            echo "::error::durable last-good pointer does not match the exact requested digest"
            exit 1
          }
          aws s3 sync "$CLERMONT_BASELINE_S3_URI/baselines/$DIGEST/" \
            "$STORE/baselines/$DIGEST/" --no-progress --no-follow-symlinks

      - name: Materialize the certified Clermont export
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: |
          REQUEST="$RUNNER_TEMP/clermont-baseline-request.json"
          npm run clermont:materialize -- \
            --request "$REQUEST" \
            --baseline-store data/baselines/lake/clermont \
            --output data/downloads/lake/clermont-permits.csv \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Consolidate the query table
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: |
          D="$PWD/data/downloads/lake"
          O="$PWD/data/artifacts/publish/lake/query-table.parquet"
          P="$PWD/data/artifacts/publish/lake/permit-table.parquet"
          AS_OF_DATE="$(date -u +%F)"
          mkdir -p "$(dirname "$O")"
          sed -e "s|\$DOWNLOAD_DIR|$D|g" -e "s|\$OUT_PARQUET|$O|g" \
              -e "s|\$PERMIT_OUT_PARQUET|$P|g" \
              -e "s|\$AS_OF_DATE|$AS_OF_DATE|g" \
              -e "s|\$AS_OF_YEAR|$(date -u +%Y)|g" \
              scripts/lake/build-query-table.sql > /tmp/lake-qt.sql
          duckdb -c ".read /tmp/lake-qt.sql"

      - name: Assemble the publish set
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: |
          REQUEST="$RUNNER_TEMP/clermont-baseline-request.json"
          DIGEST="$(jq -er '.baseline.requiredSha256' "$REQUEST")"
          node scripts/lake/build-publish-set.mjs \
            --run-id "${{ steps.target.outputs.run_id }}" \
            --clermont-baseline-sha256 "$DIGEST" \
            --clermont-evidence "data/baselines/lake/clermont/baselines/$DIGEST/baseline.json"

      - name: Compute the candidate provenance
        id: candidate
        working-directory: .
        run: |
          SCOPE=(
            pipeline/package.json
            pipeline/package-lock.json
            pipeline/docs/lake-sources.yaml
            pipeline/scripts/lake/build-query-table.sql
            pipeline/scripts/lake/build-publish-set.mjs
            pipeline/scripts/lake/publish-run.mjs
            pipeline/src/core/publish-gate.mjs
            pipeline/src/core/secondary-pin.mjs
            pipeline/src/counties/lake/enrichment-profile.mjs
            pipeline/src/counties/lake/query-table.mjs
            pipeline/src/counties/lake/permit-table.mjs
          )
          : > "$RUNNER_TEMP/provenance-components.txt"
          for FILE in "${SCOPE[@]}"; do
            test -f "$FILE"
            printf '%s  %s\n' "$(sha256sum "$FILE" | cut -d' ' -f1)" "$FILE" \
              >> "$RUNNER_TEMP/provenance-components.txt"
          done
          PROVENANCE_DIGEST="sha256:$(sort "$RUNNER_TEMP/provenance-components.txt" | sha256sum | cut -d' ' -f1)"
          echo "provenance_digest=$PROVENANCE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Freeze the local publication candidate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        working-directory: .
        run: |
          node --max-old-space-size=6144 pipeline/scripts/lake/publish-run.mjs \
            --run-id "${{ steps.target.outputs.run_id }}" \
            --mode "${{ steps.mode.outputs.mode }}" \
            --candidate-workflow-run-id "${{ github.run_id }}" \
            --provenance-digest "${{ steps.candidate.outputs.provenance_digest }}" \
            --dry-run

      - name: Verify the restored candidate identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        working-directory: .
        run: |
          REQUEST="pipeline/data/artifacts/publish/lake/manifests/${{ steps.target.outputs.run_id }}.publication-request.json"
          test -f "$REQUEST" || { echo "::error::frozen publication request is missing"; exit 1; }
          jq -e \
            --arg run "${{ steps.target.outputs.run_id }}" \
            --arg mode "${{ steps.mode.outputs.mode }}" \
            --arg workflow "${{ inputs.candidate_workflow_run_id }}" \
            --arg provenance "${{ steps.candidate.outputs.provenance_digest }}" \
            '.schemaVersion == "elephant.publication-request.v1" and
             .target.runId == $run and .target.mode == $mode and
             .target.candidateWorkflowRunId == $workflow and
             .target.provenanceDigest == $provenance' "$REQUEST" >/dev/null || {
              echo "::error::dispatch mode, source workflow, run, or provenance does not match the reviewed candidate"
              exit 1
            }
          ATTEMPT_ID="$(jq -er '.attemptId' "$REQUEST")"
          jq -e --slurpfile request "$REQUEST" --arg id "$ATTEMPT_ID" \
            '.attempts[$id].state == "BUILT" and .attempts[$id].target == $request[0].target' \
            artifacts/publication-attempts.json >/dev/null || {
              echo "::error::candidate ledger does not contain the exact reviewed BUILT target"
              exit 1
            }

      - name: Publish to IPFS
        id: publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          FILEBASE_API_TOKEN: ${{ secrets.FILEBASE_API_TOKEN }}
          SECONDARY_PIN_SERVICE_URL: ${{ secrets.SECONDARY_PIN_SERVICE_URL }}
          SECONDARY_PIN_SERVICE_TOKEN: ${{ secrets.SECONDARY_PIN_SERVICE_TOKEN }}
          PUBLISH_AUTHORIZATION_JSON_B64: ${{ secrets.PUBLISH_AUTHORIZATION_JSON_B64 }}
          PUBLISH_APPROVAL_PUBLIC_KEY_B64: ${{ secrets.PUBLISH_APPROVAL_PUBLIC_KEY_B64 }}
        run: |
          test -n "$S3_ACCESS_KEY_ID" && test -n "$S3_SECRET_ACCESS_KEY" && \
            test -n "$FILEBASE_API_TOKEN" && test -n "$SECONDARY_PIN_SERVICE_URL" && \
            test -n "$SECONDARY_PIN_SERVICE_TOKEN" || {
              echo "::error::manual publication requires Filebase and independent secondary-pin credentials"
              exit 1
            }
          test -n "$PUBLISH_AUTHORIZATION_JSON_B64" && \
            test -n "$PUBLISH_APPROVAL_PUBLIC_KEY_B64" || {
              echo "::error::manual publication requires an external exact-target authorization and trusted Ed25519 public key"
              exit 1
            }
          umask 077
          APPROVAL="$RUNNER_TEMP/lake-publication-approval.json"
          PUBLIC_KEY="$RUNNER_TEMP/lake-publication-approval.pub.pem"
          printf '%s' "$PUBLISH_AUTHORIZATION_JSON_B64" | base64 --decode > "$APPROVAL"
          printf '%s' "$PUBLISH_APPROVAL_PUBLIC_KEY_B64" | base64 --decode > "$PUBLIC_KEY"
          node --max-old-space-size=6144 scripts/lake/publish-run.mjs \
            --run-id "${{ steps.target.outputs.run_id }}" \
            --mode "${{ steps.mode.outputs.mode }}" \
            --candidate-workflow-run-id "${{ inputs.candidate_workflow_run_id }}" \
            --provenance-digest "${{ steps.candidate.outputs.provenance_digest }}" \
            --approve "$APPROVAL" \
            --approval-public-key "$PUBLIC_KEY"

      # The retrieval corpus has a reviewed, digest-bound source receipt in the
      # repository. A workflow run must not silently rewrite that receipt or
      # pretend its generated index was deployed. Publication records the exact
      # run; promoting it into RAG is a subsequent reviewed repository change
      # followed by a runtime deploy.
      - name: Report the retrieval promotion boundary
        if: ${{ steps.publish.outcome == 'success' }}
        run: |
          echo "::notice::Published run ${{ steps.target.outputs.run_id }} is not yet the served RAG corpus." \
               "Run the explicit promote:published command, review its receipt and deterministic index," \
               "and deploy the runtime as a separate change."

      # A scheduled ingestion run that fails is a terminal failure of a job
      # nobody is watching: it runs at 07:20 UTC and its only other output is a
      # workflow-run page. The engineering guidelines forbid leaving that to a
      # log, so it pages on-call through the same Events API v2 path the
      # runtime uses. Gated on the routing key being configured, and it says so
      # when it is not rather than reporting a success it did not achieve.
      - name: Page on-call for a failed ingestion run
        if: ${{ failure() }}
        working-directory: .
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
        run: |
          if [ -z "$PAGERDUTY_ROUTING_KEY" ]; then
            echo "::error::This ingestion run failed and PAGERDUTY_ROUTING_KEY is not configured," \
                 "so nobody was paged. Configure it as a repository secret."
            exit 0
          fi
          # dedup_key is the workflow, not the run, so a run failing every
          # morning keeps updating one incident instead of opening seven a week.
          STATUS=$(curl -sS -o /tmp/pd.json -w '%{http_code}' \
            -X POST https://events.pagerduty.com/v2/enqueue \
            -H 'content-type: application/json' \
            -d @- <<JSON
          {
            "routing_key": "$PAGERDUTY_ROUTING_KEY",
            "event_action": "trigger",
            "dedup_key": "lake-county-ingestion/${{ github.workflow }}",
            "payload": {
              "summary": "Lake County ingestion run failed (${{ steps.mode.outputs.mode }})",
              "source": "github-actions/${{ github.repository }}",
              "severity": "critical",
              "component": "lake-county-ingestion",
              "custom_details": {
                "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "mode": "${{ steps.mode.outputs.mode }}",
                "run_id": "${{ steps.target.outputs.run_id }}"
              }
            }
          }
          JSON
          )
          # Events API v2 accepts asynchronously: 202 means enqueued, anything
          # else means on-call was not told.
          test "$STATUS" = "202" || { echo "::error::PagerDuty returned HTTP $STATUS"; exit 1; }
          echo "::notice::paged on-call, dedup_key $(jq -r .dedup_key /tmp/pd.json)"

      - name: Report that publishing was skipped
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
        run: |
          echo "::notice::This schedule/manual dry run built local artifacts only. Publishing" \
               "requires workflow_dispatch with publish=true and an external exact-target" \
               "Ed25519 authorization; stored credentials alone are never authority."

      - uses: actions/upload-artifact@v4
        with:
          name: lake-run-${{ steps.target.outputs.run_id }}
          if-no-files-found: error
          path: |
            artifacts/latest.json
            artifacts/manifest-${{ steps.target.outputs.run_id }}.json
            artifacts/verification-${{ steps.target.outputs.run_id }}.json
            artifacts/run-history.json
            artifacts/publication-attempts.json
            artifacts/row-hashes.json
            pipeline/data/artifacts/publish/lake/runs/${{ steps.target.outputs.run_id }}/
            pipeline/data/artifacts/publish/lake/manifests/${{ steps.target.outputs.run_id }}.json
            pipeline/data/artifacts/publish/lake/manifests/${{ steps.target.outputs.run_id }}.publication-request.json
            pipeline/data/artifacts/publish/lake/cars/${{ steps.target.outputs.run_id }}.car
            pipeline/data/artifacts/publish/lake/cars/${{ steps.target.outputs.run_id }}-manifest.car
          retention-days: 30
